plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devicetracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.devicetracker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Location services
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    
    // Network
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime:2.9.0'
    
    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:20.7.0'
    
    // Force consistent versions to avoid conflicts
    constraints {
        implementation('androidx.room:room-runtime:2.6.1') {
            because 'Ensures all room dependencies use the same version'
        }
        implementation('androidx.sqlite:sqlite-framework:2.4.0') {
            because 'Ensures all sqlite dependencies use the same version'
        }
    }
}
